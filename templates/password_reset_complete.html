{% extends 'base.html' %}

{% block title %}Contraseña actualizada - Urban Motion{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card border-0 shadow-lg text-center">
                <div class="card-body p-5">
                    <i class="bi bi-check-circle" style="font-size: 3.5rem; color: #4ade80;"></i>
                    <h3 class="fw-bold mt-3" style="color: #FFFFFF !important;">¡Contraseña actualizada!</h3>
                    <p style="color: #A0A8B4 !important;" class="mt-2 mb-4">Ya podés iniciar sesión con tu nueva contraseña.</p>
                    <a href="{% url 'loguearse' %}" class="btn btn-lg fw-bold w-100" style="background-color: #E5252A; color: #fff; border: none;">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
