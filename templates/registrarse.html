
{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Registrarse - Urban Motion{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus text-warning" style="font-size:3rem;"></i>
                        <h2 class="fw-bold mt-2">Crear cuenta</h2>
                        <p class="text-muted">Unite a la comunidad Urban Motion</p>
                    </div>

                    <form action="{% url 'registrarse' %}" method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-dark btn-lg">
                                <i class="bi bi-person-check me-2"></i>Registrarse
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        ¿Ya tenés cuenta?
                        <a href="{% url 'loguearse' %}" class="text-warning fw-semibold">Iniciá sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
