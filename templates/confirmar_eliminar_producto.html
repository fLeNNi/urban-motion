
{% extends 'base.html' %}
{% load static %}

{% block title %}Eliminar Producto - Urban Motion{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm border-danger">
                <div class="card-body text-center p-5">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem;"></i>
                    <h4 class="fw-bold mt-3">¿Eliminar producto?</h4>
                    <p class="text-muted">Estás a punto de eliminar <strong>{{ producto.nombre }}</strong> (${{ producto.precio }}). Esta acción no se puede deshacer.</p>
                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger me-2">
                            <i class="bi bi-trash me-1"></i>Sí, eliminar
                        </button>
                        <a href="{% url 'admin_productos' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
