
{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Iniciar Sesión - Urban Motion{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right text-warning" style="font-size:3rem;"></i>
                        <h2 class="fw-bold mt-2">Iniciar Sesión</h2>
                        <p class="text-muted">Bienvenido de vuelta</p>
                    </div>

                    <form action="{% url 'loguearse' %}" method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-dark btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        ¿No tenés cuenta?
                        <a href="{% url 'registrarse' %}" class="text-warning fw-semibold">Registrate gratis</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
